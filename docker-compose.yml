services:
  db:
    image: postgres:16-alpine
    container_name: eco-review-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eco_admin
      POSTGRES_PASSWORD: eco_pass
      POSTGRES_DB: eco_review
    volumes:
      - eco_review_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco_admin -d eco_review"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eco-review-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco-review-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://eco_admin:eco_pass@db:5432/eco_review
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - eco_review_documents:/app/storage/documents
    ports:
      - "8000:8000"
    networks:
      - eco-review-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: eco-review-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - eco-review-net

networks:
  eco-review-net:
    driver: bridge

volumes:
  eco_review_pgdata:
  eco_review_documents:
